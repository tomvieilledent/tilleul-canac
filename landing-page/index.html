<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Le Tilleul de Canac — chambre d'hôtes en Aveyron</title>
  <meta name="description" content="Le Tilleul de Canac, chambre d'hôtes en Aveyron, aux portes de Rodez. Site en préparation." />
  <link rel="canonical" href="https://vlldnt.fr/tilleul-canac/" />
  <link rel="icon" type="image/svg+xml" href="/tilleul-canac/favicon.svg" />
  <link rel="apple-touch-icon" href="/tilleul-canac/favicon.svg" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14171a" media="(prefers-color-scheme: dark)" />
  <style>
    :root {
      --bg: #f7f3ec;
      --surface: #fffdf9;
      --text: #2b2b28;
      --muted: #5c5c54;
      --border: #ddd3c1;
      --heading: #2d4632;
      --accent: #8f4f16;
      --font-serif: "Cormorant Garamond", "Iowan Old Style", Georgia, "Times New Roman", serif;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171a; --surface: #1e2327; --text: #e7e4db; --muted: #a9a99f;
        --border: #333a3b; --heading: #a8ccac; --accent: #e39463;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      padding: 24px;
    }
    main { max-width: 30rem; text-align: center; }

    .leaf { width: 52px; height: 52px; margin: 0 auto; display: block; }

    .eyebrow {
      margin: 22px 0 0;
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 10px 0 0;
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: clamp(2.2rem, 8vw, 3.2rem);
      line-height: 1.1;
      color: var(--heading);
    }
    p.note {
      margin: 18px 0 0;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      margin-top: 26px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    footer {
      margin-top: 34px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <svg class="leaf" viewBox="0 0 64 64" aria-hidden="true">
      <path fill="#3a5a40" d="M32 5c7 8 19 12 22 26 2 11-9 19-16 20-3 .5-5-2-6-5-1 3-3 5.5-6 5-7-1-18-9-16-20C6.9 17 25 13 32 5Z"/>
      <g fill="none" stroke="#dff0e0" stroke-width="2" stroke-linecap="round">
        <path d="M32 46V10"/>
        <path d="M32 22 46 14M32 22 19 15M32 31 49 24M32 31 16 25M32 39 44 34M32 39 21 33"/>
      </g>
      <path fill="none" stroke="#7a5230" stroke-width="3.2" stroke-linecap="round" d="M32 46c0 6 0 9 1 15"/>
    </svg>

    <p class="eyebrow">Chambre d'hôtes · Aveyron</p>
    <h1>Le Tilleul de Canac</h1>
    <p class="note">
      Une chambre au calme, aux portes de Rodez.
      Le site est en cours de préparation.
    </p>

    <span class="badge">Site en construction</span>

    <footer>© Le Tilleul de Canac</footer>
  </main>
</body>
</html>
